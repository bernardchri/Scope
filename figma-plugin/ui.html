<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; margin: 0; padding: 12px; color: #111; }
  h2 { font-size: 13px; margin: 0 0 8px; }
  label { display: block; margin-top: 10px; font-weight: 600; }
  input[type="text"], select {
    width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px;
    border: 1px solid #ccc; border-radius: 4px; font-size: 12px;
  }
  fieldset { border: 1px solid #eee; border-radius: 6px; margin-top: 12px; padding: 8px; }
  legend { font-size: 11px; color: #888; padding: 0 4px; }
  .child-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .child-row input[type="checkbox"] { flex: none; }
  .child-row input[type="text"] { flex: 1; margin-top: 0; }
  .child-name { flex: 1; font-size: 11px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button {
    margin-top: 14px; width: 100%; padding: 8px; background: #18a0fb; color: #fff;
    border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px;
  }
  button:disabled { background: #ccc; cursor: default; }
  .msg { margin-top: 8px; font-size: 11px; }
  .msg.error { color: #c0392b; }
  .msg.ok { color: #27ae60; }
  #empty { color: #888; }
</style>
</head>
<body>
  <h2>Import vers SCOPE</h2>
  <div id="empty">Sélectionne un composant ou une frame dans Figma.</div>

  <div id="form" style="display:none">
    <label>Nom
      <input id="name" type="text" />
    </label>
    <label>Type
      <select id="type">
        <option value="document">Document</option>
        <option value="component">Composant</option>
        <option value="template">Template</option>
        <option value="section">Section</option>
      </select>
    </label>
    <label>Légende de l'image
      <input id="caption" type="text" placeholder="ex: Version desktop" />
    </label>

    <fieldset>
      <legend>Zones d'intérêt (calques enfants)</legend>
      <div id="children"></div>
    </fieldset>

    <fieldset>
      <legend>Pont SCOPE (voir Paramètres dans l'app)</legend>
      <label>Port
        <input id="port" type="text" placeholder="ex: 51234" />
      </label>
      <label>Token
        <input id="token" type="text" placeholder="collé depuis Paramètres SCOPE" />
      </label>
    </fieldset>

    <button id="send">Envoyer vers SCOPE</button>
    <div id="msg" class="msg"></div>
  </div>

<script>
  const el = (id) => document.getElementById(id);

  function renderChildren(children) {
    const container = el('children');
    container.innerHTML = '';
    if (!children.length) {
      container.innerHTML = '<div style="color:#888">Aucun calque enfant direct.</div>';
      return;
    }
    children.forEach((c) => {
      const row = document.createElement('div');
      row.className = 'child-row';
      row.innerHTML =
        '<input type="checkbox" ' + (c.included ? 'checked' : '') + ' />' +
        '<span class="child-name" title="' + c.name + '">' + c.name + '</span>' +
        '<input type="text" placeholder="nom du pin" value="' + (c.label || '') + '" ' + (c.included ? '' : 'disabled') + ' />';
      container.appendChild(row);

      const checkbox = row.querySelector('input[type="checkbox"]');
      const labelInput = row.querySelector('input[type="text"]');

      checkbox.addEventListener('change', () => {
        labelInput.disabled = !checkbox.checked;
        const label = checkbox.checked ? (labelInput.value || c.name) : '';
        if (!checkbox.checked) labelInput.value = '';
        else if (!labelInput.value) labelInput.value = label;
        parent.postMessage({ pluginMessage: { type: 'tag-pin', childId: c.id, label } }, '*');
      });
      labelInput.addEventListener('change', () => {
        if (!checkbox.checked) return;
        parent.postMessage({ pluginMessage: { type: 'tag-pin', childId: c.id, label: labelInput.value } }, '*');
      });
    });
  }

  function renderNode(node) {
    if (!node) {
      el('empty').style.display = 'block';
      el('form').style.display = 'none';
      return;
    }
    el('empty').style.display = 'none';
    el('form').style.display = 'block';
    el('name').value = node.name;
    el('type').value = node.type;
    el('caption').value = node.caption || '';
    renderChildren(node.children);
  }

  el('type').addEventListener('change', () => {
    parent.postMessage({ pluginMessage: { type: 'tag-type', value: el('type').value } }, '*');
  });

  el('caption').addEventListener('change', () => {
    parent.postMessage({ pluginMessage: { type: 'tag-caption', value: el('caption').value } }, '*');
  });

  el('send').addEventListener('click', () => {
    const port = el('port').value.trim();
    const token = el('token').value.trim();
    parent.postMessage({ pluginMessage: { type: 'save-config', port, token } }, '*');
    el('msg').textContent = 'Export en cours…';
    el('msg').className = 'msg';
    parent.postMessage({ pluginMessage: { type: 'send', name: el('name').value, port, token } }, '*');
  });

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'selection') {
      renderNode(msg.node);
    } else if (msg.type === 'config') {
      el('port').value = msg.port || '';
      el('token').value = msg.token || '';
    } else if (msg.type === 'sent-ok') {
      el('msg').textContent = 'Envoyé ✓';
      el('msg').className = 'msg ok';
    } else if (msg.type === 'error') {
      el('msg').textContent = msg.message;
      el('msg').className = 'msg error';
    }
  };

  parent.postMessage({ pluginMessage: { type: 'init' } }, '*');
</script>
</body>
</html>
